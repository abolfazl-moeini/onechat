# qoder profile — drives desktop Qoder IDE via ai-driver CDP bridge (port 9223)
name: qoder
binary: ai-driver
new:    ["run", "--driver", "qoder", "-m", "{model}", "--json", "-w", ".", "{prompt}"]
resume: ["run", "--driver", "qoder", "-m", "{model}", "--session", "{session_id}", "--json", "-w", ".", "{prompt}"]
auto:   []
prompt_via: argv
parser: claude_stream_json
quota_patterns: ["quota", "no longer available", "limit reach", "limit reached"]
auth_patterns:  ["login", "unauthorized"]
unavailable_patterns: ["connection refused", "not running", "cannot connect", "no output", "remote debugging", "cdp"]
share_cooldown: true
