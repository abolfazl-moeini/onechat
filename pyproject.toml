[project]
name = "onechat-cli"
version = "0.1.1"
description = "One chat session surviving AI backend switches (CLI agents + OpenAI-compatible APIs)"
readme = "README.md"
license = "MIT"
authors = [{ name = "Abolfazl Moeini" }]
requires-python = ">=3.12"
keywords = ["ai", "cli", "llm", "router", "claude-code", "codex", "gemini", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.8",
    "typer>=0.12",
    "pyyaml>=6",
    "openai==3.42.1",
]

[project.urls]
Homepage = "https://github.com/abolfazl-moeini/onechat"
Repository = "https://github.com/abolfazl-moeini/onechat"
Issues = "https://github.com/abolfazl-moeini/onechat/issues"

[project.scripts]
onechat = "onechat.cli:app"

[build-system]
requires = ["uv_build>=0.8,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "onechat"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs network/CLIs"]
addopts = "-m 'not live'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
